# Render Blueprint: static site, no build step.
services:
  - type: web
    name: huzaifa-islam-portfolio
    runtime: static
    buildCommand: echo "Static site, nothing to build"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /videos/*
        name: Cache-Control
        value: public, max-age=604800
