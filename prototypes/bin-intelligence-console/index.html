<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BIN Intelligence Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;--radius-sm:4px;--radius-md:6px;--radius-lg:8px;--radius-xl:12px;--radius-full:999px;}
/* Tokens: the design system (tokens.json) */
:root{
  --background:#ffffff; --foreground:#0a0a0a; --card:#ffffff; --muted:#f5f5f5; --muted-fg:#737373; --accent:#f5f5f5;
  --border:#e5e5e5; --input:#e5e5e5; --ring:#737373; --primary:#3e4fe0; --primary-fg:#fafafa; --primary-text:#3e4fe0;
  --destructive:#dc2626; --success:#15803d; --info:#2563eb; --surface:#fafafa; --sidebar:#fafafa; --sidebar-accent:#f5f6fe;
  --attn:color-mix(in srgb,var(--primary) 10%,transparent);
  --blue-50:#eef0fd; --blue-100:#dfe3fb; --blue-700:#2f3fc4;
  --shadow-xs:0px 1px 2px 0px rgba(0,0,0,.05); --shadow-sm:0px 1px 3px 0px rgba(0,0,0,.10),0px 1px 2px -1px rgba(0,0,0,.10);
  --shadow-xl:0px 20px 25px -5px rgba(0,0,0,.10),0px 8px 10px -6px rgba(0,0,0,.10);
}
/* Shades that were previously hard-coded further down. Same light values. */
:root{
  --app:#f7f8fd; --app2:#fafafa; --fg-2:#404040; --fg-3:#525252;
  --muted-2:#f0f0f0; --muted-3:#e8e8e8; --hover:#f7f7f7;
  --on-solid:#fff; --heat:62,79,224; --knob:#fff;
}
/* Dark is the same token set with different values, so nothing is defined only in a query. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--foreground);font:14px/1.5 "Geist",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-size:.875rem}
a{color:var(--primary-text);text-decoration:none}
.rbar{margin:0 0 16px}.rb-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rb-track{position:relative;height:12px;margin:8px 0 8px;border-radius:var(--radius-md);background:var(--muted,#f4f4f5);border:1px solid var(--border)}
.rb-mid{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--primary) 22%,transparent);border-radius:var(--radius-md)}
.rb-med{position:absolute;top:3px;bottom:3px;background:color-mix(in srgb,var(--primary) 55%,transparent);border-radius:var(--radius-sm)}
.rb-you{position:absolute;top:-4px;width:3px;height:18px;margin-left:0;background:var(--foreground,#0a0a0a);border-radius:var(--radius-sm)}
.rb-leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.875rem}.rb-leg i{display:inline-block;width:10px;height:10px;border-radius:var(--radius-sm);margin-right:4px;vertical-align:-1px}
.sw-mid{background:color-mix(in srgb,var(--primary) 22%,transparent)}.sw-you{background:var(--foreground,#0a0a0a);width:3px!important}
.rb-mini{display:inline-block;width:90px}.rb-mini .rb-track{margin:0}
.stepedu{margin:4px 0 8px}[data-scale-legend] .grid>div{min-width:0}.steprow>span{min-width:0;overflow-wrap:anywhere}.steplist{display:grid;gap:8px}.steprow{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:var(--radius-md)}.steprow .steps{margin-top:6px;flex-shrink:0}.steprow.cur{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.steps{display:inline-flex;gap:4px;vertical-align:middle;margin-right:8px}.steps i{width:14px;height:6px;border-radius:var(--radius-sm);background:var(--border)}.steps i.on{background:var(--primary)}
a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
/* sidebar */
aside.side{background:var(--sidebar);border-right:1px solid var(--border);padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:0}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 16px}
.brand .lg{width:28px;height:28px;border-radius:var(--radius-lg);background:var(--primary);display:grid;place-items:center;color:var(--on-solid);font-weight:600;font-size:.875rem}
.brand b{font-weight:600;font-size:.875rem;display:block}
.brand small{display:block;color:var(--muted-fg);font-size:.75rem;line-height:1.2}
.side .grp{font-size:.75rem;line-height:16px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-fg);padding:16px 8px 4px;display:flex;justify-content:space-between}
.side .grp em{font-style:normal;letter-spacing:0;text-transform:none;border:1px solid var(--border);border-radius:var(--radius-full);padding:0 8px}
.nb{display:flex;align-items:center;gap:8px;width:100%;height:32px;text-align:left;background:none;border:0;border-radius:var(--radius-md);padding:0 8px;color:var(--foreground);cursor:pointer;font-size:.875rem}
.nb svg{width:16px;height:16px;flex:none;color:var(--muted-fg)}
.nb:hover{background:var(--sidebar-accent)}
.nb.dim{color:var(--muted-fg);cursor:default}
.nb.dim:hover{background:none}
.kids{margin-left:16px;border-left:1px solid var(--border);padding-left:8px;display:flex;flex-direction:column;gap:0}
.kids .nb{height:28px;font-size:.875rem}
.kids .nb.on{background:var(--blue-50);color:var(--primary);font-weight:600}
.newtag{margin-left:auto;font-size:.75rem;color:var(--primary-text);background:color-mix(in srgb,var(--primary) 12%,transparent);border-radius:var(--radius-md);padding:0 8px;font-weight:500}
main{display:flex;flex-direction:column;min-width:0;overflow:auto;background:var(--app)}
main > *{flex:none}
/* top bar */
.testbar{background:var(--attn);color:var(--primary-text);font-size:.75rem;font-weight:500;text-align:center;padding:4px 8px}
.topbar{display:flex;align-items:center;gap:12px;height:52px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:5}
.crumb{font-size:.875rem;color:var(--muted-fg);white-space:nowrap}
.crumb b{color:var(--foreground);font-weight:500}
.search{flex:1;max-width:420px;margin-left:12px;display:flex;align-items:center;gap:8px;height:34px;border:1px solid var(--blue-100);border-radius:var(--radius-lg);padding:0 12px;background:var(--blue-50);color:var(--muted-fg);cursor:text;font-size:.875rem}
.search kbd,.kbd{margin-left:auto;font-family:"Geist Mono",monospace;font-size:.75rem;border:1px solid var(--border);border-radius:var(--radius-md);padding:0 4px;background:var(--background)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.modesw{display:flex;align-items:center;gap:8px;font-size:.875rem;cursor:pointer;white-space:nowrap}
.sample{font-size:.75rem;color:var(--muted-fg);background:var(--muted);border-radius:var(--radius-md);padding:4px 8px;font-weight:500;white-space:nowrap}
/* page */
.page{padding:20px 32px 32px;display:flex;flex-direction:column;gap:16px;max-width:1320px;width:100%}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{color:var(--foreground);margin:0;font-size:1.5rem;line-height:2rem;font-weight:600;letter-spacing:-.025em}
.ph p{margin:4px 0 0;color:var(--muted-fg);max-width:75ch;font-size:.875rem}
.ph .acts{align-items:center}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.subnav{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;margin-top:-4px}
.subnav button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted-fg);white-space:nowrap;font-size:.875rem;font-weight:500;margin-bottom:0}
.subnav button:hover{color:var(--foreground)}
.subnav button.on{color:var(--primary);border-bottom-color:var(--primary)}
.subnav .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:var(--radius-full);background:var(--muted);color:var(--foreground);font-size:.75rem;margin-left:4px}
.subnav .cnt.hot{background:var(--primary);color:var(--on-solid)}
.subnav button.on .cnt{background:var(--blue-100);color:var(--primary)}
/* primitives */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-xs)}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 0;flex-wrap:wrap}
.card .hd h2{margin:0;font-size:1rem;font-weight:600;display:flex;align-items:center;gap:8px}
.card .bd{padding:16px 20px 20px}
.card .ft{border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(300px,1fr);align-items:start}
/* Lookup and Alerts: the text-heavy card gets the room (Card facts, Recent changes), so values never wrap word by word. */
@media (min-width:1680px){.lkg{grid-template-columns:minmax(0,1.5fr) repeat(2,minmax(0,1fr))}.lkg:has(> :nth-child(4)){grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr))}}
@media (min-width:900px) and (max-width:1679px){.lkg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.alg{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr)}}
/* the type x network matrix needs 640px; below that the two cards stack instead of hiding columns */
@media (max-width:1400px){.insgrid{grid-template-columns:1fr}}
/* A field and its size on one line, so a long field name cannot wrap between the numbers. */
.fline{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:4px 0}
.fline > span{color:var(--muted-fg)}
.fline > b{font-weight:500;white-space:nowrap}
.kpi{padding:16px 20px}
.kpi .k{font-size:.875rem;color:var(--muted-fg);display:flex;align-items:center;gap:8px}
.kpi .v{color:var(--primary);font-size:1.5rem;font-weight:600;letter-spacing:-.025em;line-height:1.15;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:.75rem;margin-top:4px;color:var(--muted-fg)}
.up{color:var(--success)} .down{color:var(--foreground);font-weight:600} .fell{color:var(--destructive)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:500;padding:0 8px;border-radius:var(--radius-md);white-space:nowrap;line-height:20px}
.badge.ok{background:var(--muted);color:var(--foreground)} /* status reads from its words; no green pill */
.badge.warn{background:var(--attn);color:var(--primary-text)}
.badge.bad{background:color-mix(in srgb,var(--destructive) 15%,transparent);color:var(--destructive)}
.badge.info{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.badge.brand{background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary-text)}
.badge.neutral{background:var(--muted);color:var(--foreground)}
.badge.test{background:var(--attn);color:var(--primary-text)}
.btn{border:1px solid var(--border);background:var(--background);border-radius:var(--radius-lg);height:34px;padding:0 12px;cursor:pointer;font-size:.875rem;font-weight:500;white-space:nowrap;box-shadow:var(--shadow-xs);display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--accent)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{background:color-mix(in srgb,var(--primary) 88%,black)}
.btn.danger{background:var(--destructive);border-color:var(--destructive);color:var(--on-solid)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--primary-text);padding:0 8px;height:28px}
.btn.ghost:hover{background:var(--accent)}
.btn.sm{height:28px;padding:0 12px;font-size:.75rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--primary-text);cursor:pointer;font-size:inherit}
/* Loading skeleton: muted bars, a slow pulse (off with reduced motion). */
.sk{display:block;background:var(--muted);border-radius:var(--radius-md);animation:skp 1.4s ease-in-out infinite}
@keyframes skp{50%{opacity:.55}}@media (prefers-reduced-motion:reduce){.sk{animation:none}}
/* Events sheet entry point: a quiet text link at the start of every page header. */
.evlink{font-size:.875rem;color:var(--muted-fg);margin-right:4px}.evlink:hover{color:var(--primary-text)}
table.evt{width:100%;table-layout:fixed;font-size:.875rem}table.evt th,table.evt td{padding:8px 8px 8px 0;vertical-align:top;overflow-wrap:anywhere}
table.evt th:nth-child(1){width:38%}table.evt th:nth-child(3){width:30%}table.evt td.mono{font-size:.75rem}
.link:hover{text-decoration:underline}
input[type=text],input[type=search],input[type=number],select,textarea{border:1px solid var(--input);border-radius:var(--radius-lg);background:var(--background);height:34px;padding:0 12px;box-shadow:var(--shadow-xs);min-width:0}
textarea{height:auto;padding:8px 12px}
:focus-visible{outline:2px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:1px}
table{border-collapse:collapse;width:100%;font-size:.875rem}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-weight:500;color:var(--muted-fg);height:38px;font-size:.75rem;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface)}
.tw{overflow-x:auto}
.tw table tr:last-child td{border-bottom:0}
.note{font-size:.75rem;color:var(--muted-fg)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--border);background:var(--background);border-radius:var(--radius-full);height:28px;padding:0 12px;cursor:pointer;font-size:.75rem;color:var(--muted-fg)}
.chip.set{border-style:solid;border-color:var(--blue-100);color:var(--primary);background:var(--blue-50)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--background)}
.seg button{border:0;background:none;height:30px;padding:0 12px;font-size:.75rem;cursor:pointer;color:var(--muted-fg)}
.seg button.on{background:var(--blue-50);color:var(--primary);font-weight:600}
.sw{position:relative;display:inline-block;width:32px;height:18px;flex:none}
.sw input{appearance:none;position:absolute;inset:0;margin:0;border-radius:var(--radius-full);background:var(--input);cursor:pointer}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--knob);box-shadow:var(--shadow-sm);transition:left .15s}
.sw input:checked{background:var(--primary)}
.sw.test input:checked{background:var(--primary)}
.sw input:checked::after{left:16px}
.term{border-bottom:1px dotted var(--muted-fg);cursor:help}
.progress{height:6px;border-radius:var(--radius-full);background:var(--muted);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary)}
.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.check:first-child{border-top:0}
.check .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;font-size:.75rem}
.check.done .dot{background:var(--primary);border-color:var(--primary);color:var(--on-solid)}
.check.done .t{color:var(--muted-fg);text-decoration:line-through}
.item{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--border)}
.item:first-child{border-top:0}
.item .ic{width:36px;height:36px;border-radius:var(--radius-xl);display:grid;place-items:center;flex:none;background:var(--blue-50);color:var(--primary)}
.item .ic.warn{background:var(--attn);color:var(--primary)}
.item .ic.brand{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary-text)}
.item .tx{flex:1;min-width:0}
.item .tx b{font-weight:500;display:block}
.item .imp{color:var(--success);font-size:.75rem;font-weight:500}
.kv{display:grid;grid-template-columns:minmax(128px,44%) 1fr;gap:12px 16px;font-size:.875rem}
.kv > span:nth-child(odd){color:var(--muted-fg)}
.nets{display:flex;gap:8px;flex-wrap:wrap}
.net{border:1px solid var(--border);border-radius:var(--radius-xl);padding:8px 12px;min-width:140px}
.net b{display:block;font-size:.875rem}
.net small{color:var(--muted-fg);font-size:.75rem}
pre.code{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:12px 16px;overflow-x:auto;font:12px/1.55 "Geist Mono",monospace}
.empty{padding:36px 20px;text-align:center;color:var(--muted-fg)}
.empty b{display:block;color:var(--foreground);font-size:1rem;margin-bottom:4px}
/* charts */
svg text{fill:var(--muted-fg);font-size:.75rem;font-family:"Geist",sans-serif}
.hbar{display:grid;grid-template-columns:84px 1fr 40px 54px;gap:12px;align-items:center;font-size:.875rem;padding:8px 0}
.hbar .tr{height:8px;background:var(--muted);border-radius:var(--radius-full);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--primary);border-radius:var(--radius-full)}
.hbar .tr i.low{background:var(--muted-fg)}
.hbar button{all:unset;cursor:pointer;color:var(--foreground)}
.hbar button:hover{text-decoration:underline}
/* rule builder */
.cond{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0}
.cond .and{font-size:.75rem;font-weight:600;color:var(--muted-fg);width:34px}
.bt{position:sticky;top:72px}
.bigstat{color:var(--primary);font-size:2rem;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.warnline{display:flex;gap:8px;align-items:flex-start;font-size:.875rem;background:var(--attn);border-radius:var(--radius-lg);padding:8px 12px}
/* drawer, dialog, palette, toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--card);border-left:1px solid var(--border);box-shadow:var(--shadow-xl);z-index:31;display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.drawer .dh h3{margin:0;font-size:1rem;font-weight:600;flex:1}
.drawer .db{padding:20px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.drawer .df{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:none;font-size:1.25rem;line-height:1;cursor:pointer;color:var(--muted-fg);width:30px;height:30px;border-radius:var(--radius-md)}
.x:hover{background:var(--accent)}
.dialog{position:fixed;z-index:31;top:50%;left:50%;transform:translate(-50%,-50%);width:min(480px,calc(100vw - 32px));background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl)}
.dialog .db{padding:20px}
.dialog h3{margin:0 0 8px;font-size:1rem}
.dialog .df{padding:0 20px 20px;display:flex;justify-content:flex-end;gap:8px}
.palette{position:fixed;z-index:41;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 32px));background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--border);border-radius:0;height:52px;padding:0 20px;font-size:1rem;box-shadow:none;background:var(--card)}
.palette input:focus{outline:none}
.palette .res{max-height:50vh;overflow-y:auto;padding:8px}
.palette .res button{display:flex;width:100%;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:8px 12px;border-radius:var(--radius-lg);cursor:pointer;font-size:.875rem}
.palette .res button.sel,.palette .res button:hover{background:var(--accent)}
.palette .res .gl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-fg);padding:8px 12px 4px}
.palette .res small{margin-left:auto;color:var(--muted-fg)}

/* Tables follow the kit's Table atom (the design system,
   components/ui/table.js). Tailwind classes there map to these values via
   tokens.json: rounded-lg = radius/lg = 10px, bg-sidebar = #fafafa,
   text-sm = .875rem, h-10 = 40px, first:pl-6 / last:pr-6 = 24px.
   The heat matrix and .compact keep their own geometry. */
.tw:has(> table:not(.mx):not(.compact)){border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--background)}
.tw > table:not(.mx):not(.compact){font-size:.875rem}
.tw > table:not(.mx):not(.compact) thead tr{border-bottom:1px solid var(--border)}
.tw > table:not(.mx):not(.compact) th{height:40px;background:var(--sidebar);padding:0 8px;font-size:.875rem;font-weight:500;color:var(--muted-fg);border-bottom:0}
.tw > table:not(.mx):not(.compact) td{height:52px;padding:12px 8px;border-bottom:0;vertical-align:top;line-height:1.45;color:var(--foreground)}
.tw > table:not(.mx):not(.compact) tbody tr{border-bottom:1px solid var(--border)}
.tw > table:not(.mx):not(.compact) tbody tr:last-child{border-bottom:0}
.tw > table:not(.mx):not(.compact) tbody tr:hover{background:color-mix(in srgb,var(--muted) 40%,transparent)}
.tw > table:not(.mx):not(.compact) th:first-child,.tw > table:not(.mx):not(.compact) td:first-child{padding-left:24px}
.tw > table:not(.mx):not(.compact) th:last-child,.tw > table:not(.mx):not(.compact) td:last-child{padding-right:24px}
/* Clarity: a secondary line is a smaller size that still wraps, never a clamp. */
.tw > table:not(.mx):not(.compact) .note{font-size:.875rem;line-height:1.5;white-space:normal}
.tw > table:not(.mx):not(.compact) td b{font-weight:500}
/* One summarised row standing in for many thin ones. */
tr.sumrow td{background:var(--muted);color:var(--muted-fg)}
tr.sumrow:hover td{background:var(--muted)}
tr.sumrow .link{font-size:.875rem}
/* The mobile counterpart of that row. */
div.rcard.sumrow{background:var(--muted);color:var(--muted-fg)}
/* The atom is a framed box, so inside a card it takes a gutter rather than sitting on the
   card's own frame and drawing a second line 1px away. The footers keep the full card width. */
.card > .bd > .tw:has(> table:not(.mx):not(.compact)){margin:0 16px}

/* corrections queue */
.tfoot,.kpi .d,.badge,.tnum{font-variant-numeric:tabular-nums}
div.rcard{cursor:default}
.rlist > div.rcard:first-child{border-top:0}
td.actq{width:1%;white-space:nowrap}
.bigrow{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.bigrow + .bigrow{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}

/* Status filter for the corrections queue: one level down from the tab strip, so the
   two controls are not mistaken for each other. Count lives in the chip. */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chips button{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;font-size:.875rem;
  border:1px solid var(--border);border-radius:var(--radius-full);background:var(--card);color:var(--muted-fg);cursor:pointer}
.chips button:hover{background:var(--muted)}
.chips button.on{border-color:var(--primary);background:var(--blue-50);color:var(--primary-text);font-weight:600}
.chips button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.chips .n{font-variant-numeric:tabular-nums;font-weight:600;color:var(--foreground)}
.chips button.on .n{color:var(--primary-text)}

/* The reasoning behind the queue, folded shut by default. */
details.how{margin:16px 0 0;border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--card)}
details.how > summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:500;display:flex;align-items:center;gap:8px}
details.how > summary::-webkit-details-marker{display:none}
details.how > summary::before{content:"";flex:none;width:6px;height:6px;border-right:1.5px solid var(--muted-fg);border-bottom:1.5px solid var(--muted-fg);transform:rotate(-45deg);transition:transform .15s ease}
details.how[open] > summary::before{transform:rotate(45deg)}
details.how > summary:hover{background:var(--muted)}
details.how > summary:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.howb{padding:4px 16px 16px;border-top:1px solid var(--border)}
.howb p{margin:12px 0 0;font-size:.875rem;line-height:1.55;color:var(--muted-fg)}
.howb b{color:var(--foreground);font-weight:500}
/* Backtest headline: a few labelled figures read faster than one big number and a run-on line. */
.btrow{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-end}
.btrow > div{display:flex;flex-direction:column;gap:0;min-width:0}
.btv{font-size:1.25rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--foreground)}
.btrow .bigstat{line-height:1.05}

@media (prefers-reduced-motion:reduce){details.how > summary::before{transition:none}}

/* "proposed" label: the same pill as the sidebar's Security "proposed" */

/* Card insights › By card range: the Lookup range bar beside its words */
.rcell{display:flex;align-items:center;gap:8px;white-space:nowrap}
/* Guided tour: kit card + shadow tokens; one popover beside the element it explains. */

@keyframes tourIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.tour h3{margin:8px 0 8px;font-size:1rem;font-weight:600}

.tour .tr2{display:flex;gap:8px;align-items:center;margin-top:16px}.tour .tr2 .sp{flex:1}
.tour-on{outline:2px solid var(--primary)!important;outline-offset:3px;border-radius:var(--radius-lg)}
@media (prefers-reduced-motion:reduce){.tour{animation:none}}

  const evCell=r=>flt==='auto'?esc(autoWhy(r))
    :flt==='look'?`<b style="font-weight:500">${esc(lookReason(r))}</b><div class="note">${esc(lookEv(r))}</div>`
    :`<b style="font-weight:500">${esc(readyWho(r))}</b><div class="note">${esc(readyEv(r))}</div>`;
  const chg=r=>`<span class="mono">${corrWas(r)}</span> &rarr; <b class="mono">${esc(r.now)}</b>`;
  // Counted off the rows, not written down: a row counts as a test card when its reason names one,

  const mcard=r=>`<div class="rcard"><span class="rc1"><b class="mono">${r.bin}</b><span class="tnum">${fmt(r.pay)}</span></span>

  // Ready gets the bulk bar; the other two get a footer that reconciles the chip with the rows.

    : flt==='look'
    ? `<div class="tfoot"><span>${fmt(t.look)} rows · ${fmt(t.lookPay)} payments of evidence</span><span>${WIN}</span></div>`

  const how=`<details class="how"><summary>How corrections work</summary><div class="howb">
    <p><b>Two scopes, and only one of them is ours.</b> A catalogue fix changes the range for every merchant on Acme Pay, and Acme Pay makes exactly two: adding the scheme that owns an IIN prefix (${OWNED.map(o=>`<span class="mono">${o[0]}</span> ${o[1]}`).join(' · ')}), and normalising a scheme name to one stable code (${NORM.map(o=>`<span class="mono">${o[0]}</span> → <span class="mono">${o[1]}</span>`).join(' · ')}). Anything with a commercial consequence — card type, business or consumer, which network a co-badged card routes to — changes ${esc(SCOPEW.you)}, and only when you say so. Prefixes two schemes share are left alone (${SHARED.map(o=>`<span class="mono">${o[0]}</span> ${o[1]}`).join(' · ')}), and on the <b class="tnum">${fmt(BUCKET.cobadged.n)}</b> genuinely co-badged ranges you charge (${fmt(BUCKET.cobadged.pay)} payments) Acme Pay never picks the primary for you: there "primary" is a routing choice, not a fact.</p>
    <p><b>What counts as a witness.</b> Independent processors only. ${EXCL.map(x=>`<span class="mono">${x}</span>`).join(' and ')} are left out of the processor count <i>and</i> the payment total, because a simulator echoing a value back is not evidence. Both numbers on a row come from the same population, so no row can claim ten processors on one definition and a thousand payments on another. Processors returned card data on <b class="tnum">${fmt(BOOK.pcd)}</b> of your ${fmt(BOOK.pay)} payments and only <b class="tnum">${fmt(BOOK.pcdType)}</b> of those carried a card type, which is why the counts here are small.</p>
    <p><b>Test and round-number ranges.</b> <b class="tnum">${fmt(TESTBIN.length)}</b> ranges in this window are published test PANs, so they never reach ${esc(ST.ready)}: ${TESTBIN.map(b=>`<span class="mono">${b}</span>`).join(' · ')}. Of those, ${TESTBIN.filter(b=>TESTWHY[b]).map(b=>`<span class="mono">${b}</span> — ${TESTWHY[b]}`).join('; and ')}. ${ROUNDISH.map(b=>`<span class="mono">${b}</span>`).join(' · ')} are round-number ranges: not published test PANs, so they are not excluded — two of them are under ${esc(ST.ready)} and say so on the row. Worth settling before any of them carries a headline.</p>
    <p><b>Why the bar differs by field.</b> Card type: <b class="tnum">${fmt(ASYM.type.agree)}</b> ranges where two or more independent processors agree, <b class="tnum">${fmt(ASYM.type.single)}</b> resting on a single processor, <b class="tnum">${fmt(ASYM.type.clash)}</b> where processors actively contradict each other — and all five are test cards. Put at payment level, not one of the ${fmt(ASYM.type.ofPay)} payments behind a card-type disagreement has two independent processors agreeing: ${fmt(ASYM.type.clashPay)} of them sit on those five contradicting test cards and the rest are single-processor claims. Brand is the opposite: <b class="tnum">${fmt(ASYM.brand.agree)}</b> unanimous, ${fmt(ASYM.brand.single)} single-processor, <b class="tnum">${fmt(ASYM.brand.clash)}</b> contradictions. On <span class="mono">${ASYM.example.bin}</span>, ${fmt(ASYM.example.credit)} independent processors report <span class="mono">CREDIT</span> and ${fmt(ASYM.example.debit)} report <span class="mono">DEBIT</span> — ${ASYM.example.who}; counting Acme Pay's own test gateway it is ${ASYM.example.withGw}, and it is not ${fmt(ASYM.example.notQuote)}, which is how many processors returned any card data for the range. So brand evidence is trustworthy in this data and card-type evidence is not, and one global threshold would have promoted simulator output into the catalogue. No disagreement row clears the ${esc(ST.ready)} bar — everything ready is a missing issuing country.</p>
    <p><b>Shipping it.</b> Here the prefix rule runs at lookup time, which is honest for a demo but not how it would ship: in production it runs once per catalogue sync and stores the corrected range, so every reader gets the same answer and the change is auditable. Overrides apply to your account. Publishing a corrected range to every merchant on Acme Pay comes at launch. Reporting a field for Acme Pay to review and fix for everyone, with your opt-in, comes <em class="proposed">Later</em>.</p>
  </div></details>`;

  return header('Customization','What we got wrong on the cards you charge, and what you can do about it.',
   `<label class="btn" for="csvUp">Import CSV</label><input type="file" id="csvUp" accept=".csv,.txt" hidden><button class="btn primary" id="ovField">Add override</button>`)+subnav()+
  `<p class="note" style="margin:-4px 0 0;max-width:80ch">${WIN} · ${fmt(BOOK.bins)} card ranges charged · ${fmt(BOOK.pay)} payments. Sample data.</p>`+
  (state.settings.contrib?'':`<div class="infoline">Sharing differences back to the Acme Pay catalogue is off in <button class="link" data-goset="1">Settings</button>. Acme Pay still keeps the scheme-prefix rule and normalisation up to date for everyone; nothing reaches your account unless you choose it.</div>`)+
  `<div class="seg">${[['mis','Corrections']].concat(OPSVIEW?[['cls','Data gaps']]:[]).concat([['rep','Reports · '+openRep]]).map(([k,l])=>`<button data-qtab="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>`+
  (tab==='cls'?`
  <div class="infoline"><span><b>Internal view · Acme Pay ops.</b> Catalogue coverage is Acme Pay's to fix, not the merchant's to chase, so this tab is not part of the merchant product. What a merchant sees of it is only what they run into: a lookup that returns nothing, and the corrections they can apply.</span></div>
  <p class="note" style="margin:12px 4px 12px;max-width:90ch">Everything we know is missing or contradicted on the ${fmt(BOOK.bins)} card ranges you charged, biggest first. Most of it is absence, not disagreement — and absence is the part the Corrections tab cannot fix for you.</p>
  <div class="grid g21">
    <div class="card"><div class="hd"><h2>No card range at all</h2></div><div class="bd">

    </div></div>
  </div>
  <div class="card"><div class="hd"><h2>Every finding, by size</h2><span class="note">${fmt(BOOK.pay)} payments · ${WIN}</span></div><div class="bd" style="padding:8px 0 0">
    <div class="tw"><table><thead><tr><th>#</th><th>Finding</th><th>How big it is</th><th>What you can do</th></tr></thead><tbody>${CLASSES.map(c=>`<tr><td class="num">${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td class="num actc">${CLSBTN(c)}</td></tr>`).join('')}</tbody></table></div>
    <div class="rlist">${CLASSES.map(c=>`<div class="rcard"><span class="rc1"><b>${c[0]} · ${c[1]}</b></span><span>${c[2]}</span><span>${CLSBTN(c)}</span></div>`).join('')}</div>
    <div class="tfoot"><span>${fmt(CLASSES.length)} classes · one range can appear in more than one</span><span>${WIN}</span></div>
    <p class="note" style="margin:12px 16px 0;max-width:90ch">Class 1 is ${fmt(GAP1.bins)} of the ${fmt(BOOK.bins)} ranges you charged — ${GAP1.share}%. And missing issuing country alone, 40,000 payments, is about 50× bigger than classes 5 and 6 together (722 + 4 = ${fmt(BUCKET.look.pay)} payments) — which are the ${fmt(BUCKET.look.n)} disagreement rows inside ${esc(ST.look)}. A screen that headlines the disagreements is headlining the smallest and least reliable class.</p>
  </div></div>`
  :tab==='rep'?`<div class="card"><div class="bd" style="padding:8px 0 0">
    ${state.reports.length?`<div class="tw"><table><thead><tr><th>Reported</th><th>Card range</th><th>Field</th><th>Should be</th><th>Status</th><th></th></tr></thead><tbody>${state.reports.map(r=>`<tr><td>${r.date}</td><td class="mono">${r.bin}</td><td>${esc(r.field)}</td><td>${esc(r.should)}</td><td>${B(r.status==='In review'?'warn':'info',r.status)}</td><td class="num">${r.status==='Submitted'?`<button class="btn ghost" data-withdraw="${r.id}">Withdraw</button>`:''}</td></tr>`).join('')}</tbody></table></div>

      <div class="tfoot"><span>${fmt(state.reports.length)} report${state.reports.length===1?'':'s'} · ${fmt(openRep)} still open</span><span>We reply by email and a feed entry (signed webhooks <em class="proposed">Later</em>).</span></div>`
     :`<div class="empty"><b>No reports yet</b>A report is how you tell Acme Pay a value is wrong when you cannot fix it yourself — the whole of "No card range at all" works that way, because there is no range to override. Use Report on any card in Lookup, or on any ${esc(ST.look)} row.</div>`}
  </div></div>`
  :`
  <div class="chips">${FLT.map(([k,l,c])=>`<button data-qflt="${k}" class="${flt===k?'on':''}" aria-pressed="${flt===k}">${esc(l)} <span class="n">${fmt(c)}</span></button>`).join('')}</div>
  <p class="note" style="margin:12px 4px 12px;max-width:90ch">${CTX[flt]}</p>

    ${rows.length||sumRow?`<div class="tw"><table><thead><tr>${HEAD.map(h=>`<th${h===''||h==='Payments'?' class="num"':''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row).join('')}${sumRow}</tbody></table></div>
      <div class="rlist">${rows.map(mcard).join('')}${sumCard}</div>

     :`<div class="empty">${EMPTY[flt]}</div>`}

let USED=31482;const DAY=21,PDAYS=31;
// There is no quota, daily or monthly: requests are counted here, never capped. The only limit
// is the per-key rate, which a client that caches never approaches.
const todayUsed=()=>{const d=usageDays();return d[d.length-1];};
function usageDays(){const w=[];let v=1;for(let i=0;i<DAY;i++){v=Math.max(.6,v+Math.sin(i*1.1)*.12+(i%7===5?-.25:.04));w.push(v);}const t=w.reduce((a,b)=>a+b,0);const d=w.map(x=>Math.round(x/t*USED));d[DAY-1]+=USED-d.reduce((a,b)=>a+b,0);return d;}

  if(p.tds.length&&g==='optional'&&b){const [r,n]=b;

// Visa 4, Mastercard 2 and 5, Amex/Diners 3, Discover/Elo/UnionPay 6. Nothing else is issued.
const CARD_SPACE=/^[23456]/;
// A backtest on a handful of payments must not print 0.0% or 100.0%: those decimals claim a
// precision two observations cannot carry. Small n reads as a count, a tiny share as a bound,
// and a share only earns its decimal once 20 observations stand behind it.
const btShare=(s,n)=>!s?'0%':s<0.1?'under 0.1%':s.toFixed(s<10&&n>=20?1:0)+'%';
const btAppr=b=>!b.m.length?'—':b.m.length<20?`${b.m.filter(x=>x.status==='Succeeded').length} of ${b.m.length}`:(b.appr||0).toFixed(0)+'%';
const BATCH_MAX=1000;
const BATCH_SAMPLE='51360410\n22370200\n55501234\n60110099\n50670512\n41111111\n45099535\n22370200\n99999999\n4111-11';
function parseBatch(txt){const raw=txt.split(/[\n,;\t]+/).map(x=>x.trim()).filter(Boolean);const seen=new Set();const rows=[];let dup=0;
  raw.forEach(r=>{const clean=r.replace(/\s/g,'');const d=clean.replace(/\D/g,'');
    if(d.length<6||d.length>11||d.length!==clean.length){rows.push({input:r,status:'invalid'});return;}
    const k=d.slice(0,8);if(seen.has(k)){dup++;return;}seen.add(k);rows.push({input:r,bin:k,status:BINS[k]?'found':'missing'});});
  return {rows:rows.slice(0,BATCH_MAX),dup,over:Math.max(0,rows.length-BATCH_MAX)};}
function pBatch(){const b=state.batch;const txt=state.batchText!=null?state.batchText:BATCH_SAMPLE;
  const bins=txt.split(/[\n,;\t]+/).map(x=>x.trim().replace(/\D/g,'')).filter(x=>x.length>=6).slice(0,3);
  const rows=b?b.rows:[];const fnd=rows.filter(r=>r.status==='found'),allMis=rows.filter(r=>r.status==='missing'),inv=rows.filter(r=>r.status==='invalid');
  // A number outside scheme space is not a card we are missing - it is not a card at all.
  // Lumping the two together overstates our gaps and sends people off to report nonsense.
  const mis=allMis.filter(r=>CARD_SPACE.test(r.bin)),notCard=allMis.filter(r=>!CARD_SPACE.test(r.bin));
  const pre=fnd.filter(r=>BINS[r.bin].prepaid).length,cob=fnd.filter(r=>BINS[r.bin].networks.length>1).length;
  const st={found:B('ok','Found'),missing:B('neutral','Not in the catalogue'),invalid:B('warn','Invalid')};
  const stFor=r=>r.status==='missing'&&!CARD_SPACE.test(r.bin)?B('neutral','Not a card number'):st[r.status];
  return header('Lookup','Look up many BINs at once: paste them or upload a CSV, up to 1,000 per batch.',lmodeSeg()+`<button class="btn primary" id="bRun">Look up ${txt.split(/[\n,;\t]+/).filter(x=>x.trim()).length} BINs</button>`)+subnav()+
  `<div class="grid g21 eq">
    <div class="card"><div class="hd"><h2>BINs to look up</h2><span class="note">one per line or comma-separated · 6–11 digits</span></div><div class="bd">
      <textarea id="bIn" rows="4" class="mono" style="width:100%" aria-label="BINs to look up">${esc(txt)}</textarea>
      <div class="row" style="margin-top:12px"><label class="btn" for="bFile">Upload CSV</label><input type="file" id="bFile" accept=".csv,.txt" hidden><button class="btn ghost" id="bClear">Clear</button><span class="sp"></span><span class="note">Duplicates are merged. Each unique BIN counts as one lookup.</span></div>
    </div></div>
    <div class="card"><div class="hd"><h2>Same thing by API</h2></div><div class="bd">
      <p class="note" style="margin:0">Your developers can run this same check from your own systems: up to 1,000 BINs per call, one result per BIN in input order, with the same fields as a single lookup.</p>
      <button class="btn" data-go2dev="keys" style="margin-top:12px">Open Developers</button>
    </div></div>
  </div>
  ${b?`<div class="card"><div class="hd"><h2>Results</h2><div class="row">${B('ok',fnd.length+' found')}${mis.length?B('neutral',mis.length+' not in the catalogue'):''}${notCard.length?B('neutral',notCard.length+' not card numbers'):''}${inv.length?B('warn',inv.length+' invalid'):''}${b.dup?B('neutral',b.dup+' duplicate'+(b.dup>1?'s':'')+' merged'):''}${B('neutral',pre+' prepaid')}${B('neutral',cob+' co-badged')}</div></div>
    <div class="bd" style="padding:8px 0 0"><div class="tw tscroll"><table class="bres"><thead><tr><th>Input</th><th>Status</th><th>Networks</th><th>Type</th><th>Prepaid</th><th>Tier</th><th>Installments</th><th>Country</th><th>Bank</th></tr></thead><tbody>

  `<div class="card"><div class="empty"><b>Run a lookup to see results</b>Paste BINs above or upload a CSV. Results show network, card type, prepaid or voucher, tier, installments, country and bank.</div></div>`}`;}
function wireBatch(){
  on('[data-lmode]',el=>{state.lmode=el.dataset.lmode;render();});

  const bf=$('bFile');if(bf)bf.onchange=()=>{const f=bf.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.batchText=String(r.result).split(/\r?\n/).map(l=>l.split(',')[0].trim()).filter(x=>x&&!/^bin$/i.test(x)).join('\n');state.batch=null;render();toast('Loaded '+f.name+'. Press Look up.');};r.readAsText(f);};
  const bc=$('bClear');if(bc)bc.onclick=()=>{state.batchText='';state.batch=null;render();};
  const cp=$('bCopy');if(cp)cp.onclick=()=>{const csv='input,status,networks,type,prepaid,voucher,segment,tier,installments_max,country,currency,bank,confidence\n'+state.batch.rows.map(r=>{if(r.status!=='found')return [r.input,r.status==='missing'?'not_found':'invalid'].join(',');const p=BINS[r.bin];return [r.input,'found',p.networks.map(n=>n[0]).join('+'),p.funding,p.prepaid,p.voucher,p.segment,p.tier,p.inst.s==='Supported'?p.inst.max:'',p.cc,p.currency,'"'+p.issuer+'"',p.conf].join(',');}).join('\n');

  // so the button's count and what it actually sends have to be the same set.

}

const OVFIELDS=['Card type','Prepaid','Issuing country','Bank','Network'];
function parseOvCsv(text){const rows=[],skip=[];
  text.split(/\r?\n/).forEach((line,i)=>{if(!line.trim())return;
    const c=line.split(/[,;\t]/).map(x=>x.trim().replace(/^"|"$/g,''));
    if(i===0&&/^bins?$/i.test(c[0]))return;
    const b=(c[0]||'').replace(/\D/g,'');const field=OVFIELDS.find(f=>f.toLowerCase()===String(c[1]||'').toLowerCase());const v=(c[2]||'').trim();
    if(b.length<6||b.length>11){skip.push([line,'BIN must be 6–11 digits']);return;}
    if(!field){skip.push([line,'Field must be one of '+OVFIELDS.join(', ')]);return;}
    if(!v){skip.push([line,'No value given']);return;}
    rows.push({bin:b.slice(0,8),field,value:v});});
  return {rows:rows.slice(0,BATCH_MAX),skip,over:Math.max(0,rows.length-BATCH_MAX)};}

  on('[data-qflt]',el=>{state.qflt=el.dataset.qflt;render();});
  on('[data-clsgo]',el=>{const g=CLSGO[+el.dataset.clsgo];if(g)g[1]();});
  on('[data-qthin]',el=>{state.qthin=el.dataset.qthin==='1';render();});
  on('[data-qsel]',el=>{state.qsel=state.qsel||{};state.qsel[el.dataset.qsel]=el.checked;render();},'onchange');
  // The bulk action is the one place the consequence is spelled out again, because it is the
  // one place a single click changes more than one thing.
  const qab=$('qApplyReady');if(qab)qab.onclick=()=>{const sel=corrRows('ready').filter(r=>state.qsel&&state.qsel[r.id]);if(!sel.length)return;
    dialog(`Apply ${sel.length} correction${sel.length===1?'':'s'}?`,
      `<p class="note" style="margin:0">Each one fills a field the catalogue leaves empty, for <b>${esc(SCOPEW.you)}</b>. The lookup API starts returning your value, other merchants are unaffected, and you can remove any of them from Rules &rsaquo; Your overrides.</p>`,
      `Apply ${sel.length}`,()=>{sel.forEach(r=>addOverride(r.bin,r.field,r.now,'Applied from your corrections queue'));render();
        toast(`${sel.length} correction${sel.length===1?'':'s'} applied · ${SCOPEW.you}. Reversible.`,()=>{sel.forEach(undoCorr);render();});});};
  on('[data-withdraw]',el=>{state.reports=state.reports.filter(r=>r.id!==el.dataset.withdraw);render();toast('Report withdrawn');});
  const wf=$('wf');if(wf)wf.onsubmit=e=>{e.preventDefault();const d=$('wIn').value.replace(/\D/g,'').slice(0,8);if(d.length<6){toast('Enter at least 6 digits');return;}
    if(state.watch.includes(d)){toast('Already watching '+d);return;}state.watch.push(d);render();toast(BINS[d]?'Watching '+d:'Watching '+d+'. It is not in the catalogue yet, so the first alert will be when it appears.');};
  on('[data-unwatch]',el=>{const b=el.dataset.unwatch;state.watch=state.watch.filter(x=>x!==b);render();toast('Removed '+b,()=>{state.watch.push(b);render();});});
  on('[data-ch]',el=>{state.channels[el.dataset.ch]=el.checked;toast('Alert settings saved');},'onchange');
  const aw=$('allWatch');if(aw)aw.onclick=()=>drawer('Watched card ranges',`<div class="list">${state.watch.map(b=>`<div class="rowbtn static"><span class="mono">${b}</span><span class="note clamp2" title="${BINS[b]?esc(BINS[b].issuer):'Not in the catalogue yet'}">${BINS[b]?esc(BINS[b].issuer):'Not in the catalogue yet'}</span><button class="btn ghost" data-uw2="${b}">✕</button></div>`).join('')}</div>`,'',()=>document.querySelectorAll('[data-uw2]').forEach(b=>b.onclick=()=>{const u=b.dataset.uw2;state.watch=state.watch.filter(x=>x!==u);closeLayer();render();toast('Removed '+u,()=>{if(!state.watch.includes(u))state.watch.push(u);render();});}));
  const th=$('testHook');if(th)th.onclick=()=>{const ch=state.channels;const to=[ch.email?'email':null,ch.webhook?'webhook':null,ch.feed?'the changes feed':null].filter(Boolean);
    if(!to.length){toast('Turn on a delivery channel first, then send a test');return;}
    if(ch.webhook)state.deliveries.unshift(['bin.changed','22370200','200','91 ms','Just now']);
    render();toast('Test alert sent to '+to.join(', '),null,ch.webhook?['See delivery',()=>go('developers',{dtab:'hooks'})]:null);};
  on('[data-dtab]',el=>{state.dtab=el.dataset.dtab;render();});
  const ur=$('upRes');if(ur)ur.onclick=resultsFlow;const cr=$('clrRes');if(cr)cr.onclick=clearResults;
  const nk=$('newKey');if(nk)nk.onclick=()=>{if(state.dtab&&state.dtab!=='keys'){state.dtab='keys';render();}keyFlow();};
  const nh=$('newHook');if(nh)nh.onclick=()=>drawer('Add webhook endpoint',`<div class="field"><label for="hu">Endpoint URL</label><input type="text" id="hu" placeholder="https://"></div><div class="field"><label>Events</label>${['bin.changed','rule.affected','report.updated'].map(e=>`<label class="row" style="gap:8px;font-weight:400"><input type="checkbox" data-he="${e}" checked> <span class="mono">${e}</span></label>`).join('')}</div>`,`<button class="btn primary" id="hs">Add endpoint</button>`,()=>{$('hs').onclick=()=>{const u=$('hu').value.trim();if(!/^https:\/\//.test(u)){$('hu').focus();toast('Use an https:// URL');return;}state.hooks.push({id:nid('wh'),url:u,events:[...document.querySelectorAll('[data-he]:checked')].map(x=>x.dataset.he),status:'Enabled'});closeLayer();render();toast('Endpoint added');};});
  on('[data-log]',el=>logDrawer(+el.dataset.log));
  on('[data-kmenu]',el=>{const id=el.dataset.kmenu;menu(el,[{label:'Security controls',run:()=>keyCtl(id)},{label:'Roll key',run:()=>rollKey(id)},'-',{label:'Revoke key',danger:true,run:()=>revokeKey(id)}]);});
  on('[data-copy]',el=>{const pre=el.closest('.card,.drawer,.db,div').parentElement.querySelector('pre')||document.querySelector('.drawer pre');const t=pre?pre.textContent:'';copyText(t);});
  on('[data-hooktest]',()=>{state.deliveries.unshift(['bin.changed','test','200','87 ms','Just now']);render();toast('Test event delivered (200)');});
  on('[data-resend]',el=>{const d=state.deliveries[+el.dataset.resend];d[2]='200';d[3]='120 ms';d[4]='Just now';render();toast('Delivered on retry (200)');});
  const cp=$('chgPlan');if(cp)cp.onclick=()=>drawer('Change plan',PLANS.map(p=>`<label class="card" style="display:block;cursor:pointer"><div class="bd row"><input type="radio" name="plan" value="${p}" ${p===(state.planNext||state.plan)?'checked':''}><div style="flex:1"><b style="font-weight:500">${p}</b> <span class="note">· ${PLAN_TAG[p]}</span><div class="note">${p==='Free'?'10 standard fields · 8 digits · 1 request/second · Lookup scope · evaluation licence':p==='Basic'?'All 38 fields · token lookup · batch · catalogue + seed files · changes feed · watch list and alerts (email, feed) · Lookup, Batch, Changes':'+ daily 3DS, approval, challenge and instalments · benchmark in the API · shortlist · card insights · rules with backtest · all 5 scopes · 99.9% SLA'}</div></div><span style="font-weight:500;font-variant-numeric:tabular-nums">${PLAN_PRICES[p]?'$'+fmt(PLAN_PRICES[p])+'/mo':'$0'}</span></div></label>`).join(''),`<span class="note" style="flex:1">Changes apply from the next billing cycle (1 Nov), so this period keeps your ${esc(state.plan)} price. 12-month contract, billed monthly.</span><button class="btn primary" id="pp">Confirm</button>`,()=>{$('pp').onclick=()=>{const v=document.querySelector('[name=plan]:checked').value;closeLayer();
    if(v===state.plan){state.planNext=null;render();toast('Staying on '+v);return;}
    state.planNext=v;render();toast(v+' starts 1 Nov. This period stays on '+state.plan+'.');};});
  const pci=$('pci');if(pci)pci.onchange=()=>{(state.sdraft=state.sdraft||Object.assign({},state.settings)).pci=pci.value;render();};
  on('[data-inv]',el=>{const iv=INVOICES.find(x=>x[0]===el.dataset.inv);invoiceDrawer(iv[0],iv[1]);});
  on('[data-set]',el=>{(state.sdraft=state.sdraft||Object.assign({},state.settings))[el.dataset.set]=el.checked;const b=$('saveSet');if(b)b.disabled=!setDirty();},'onchange');
  const ss=$('saveSet');if(ss)ss.onclick=()=>{if(!setDirty()){toast('Nothing to save');return;}state.settings=Object.assign({},state.settings,state.sdraft);state.sdraft=null;render();toast('Settings saved');};
  on('[data-role]',el=>{state.team[+el.dataset.role][1]=el.value;toast('Role updated');},'onchange');
  const iv=$('invite');if(iv)iv.onclick=()=>drawer('Invite a team member',`<div class="field"><label for="ie">Email</label><input type="text" id="ie" placeholder="name@company.com"></div><div class="field"><label for="ir">Role</label><select id="ir"><option>Analyst</option><option>Developer</option><option>Admin</option><option>View only</option></select></div>`,`<button class="btn primary" id="is">Send invite</button>`,()=>{$('is').onclick=()=>{const e=$('ie').value.trim();if(!/@/.test(e)){$('ie').focus();toast('Enter a work email address');return;}state.team.push([e,$('ir').value]);closeLayer();render();toast('Invite sent to '+e);};});
}
$('bell').onclick=()=>{const its=inboxItems();drawer('Notifications',(its.length?its.map(it=>`<div class="item"><span class="ic ${it.kind==='review'?'warn':'brand'}">${it.kind==='review'?ICON.warn:ICON.spark}</span><div class="tx"><b>${esc(it.title)}</b><span class="note">${esc(it.sub)}</span></div><button class="btn sm" data-nb="${it.kind}:${it.id}">${it.btn}</button></div>`).join(''):'<div class="empty"><b>No notifications</b></div>')+`<div class="k" style="margin-top:8px">Earlier</div>`+state.changes.map(c=>`<div class="item"><span class="ic">•</span><div class="tx"><b class="mono">${c[1]}</b><span class="note">${c[2]}: ${esc(chgText(c[3]))} · ${c[0]}</span></div></div>`).join(''),'',()=>{document.querySelectorAll('[data-nb]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.nb.split(':');closeLayer();if(k==='review')review(id);else{const r=state.recs.find(x=>x.id===id);openRule(Object.assign({recId:r.id,mode:'Monitor'},r.rule));}});});};
document.querySelectorAll('#acctSw button').forEach(b=>{b.onclick=()=>setAccount(b.dataset.acct);});
// The sample acquirer has already uploaded results tagged with three of its own shop IDs, so its
// per-shop view shows on first open. A merchant never reads these: its own figures come from its payments.
if(!state.results.length)ingestCsv(sampleResultsCsv());
$('testMode').onchange=e=>{state.test=e.target.checked;$('tmLabel').textContent='Test mode · '+(state.test?'On':'Off');$('testbar').hidden=!state.test;render();toast(state.test?'Test mode on':'Viewing live data');};
render();
</script>

</body></html>
